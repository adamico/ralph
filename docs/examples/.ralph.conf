# Per-project config for ralph. Sourced as bash from the repo root.
#
# Copy to ./.ralph.conf and edit. All values are optional; defaults shown.

# Agent CLI adapter and command. AGENT_CLI selects the adapter; AGENT_CMD is
# the executable or wrapper. Wrap the entire Agent CLI in sbx for ralph-level
# sandboxing (recommended for AFK runs).
AGENT_CLI="claude"
AGENT_CMD="sbx run my-project -- claude"
AGENT_ARGS=""

# Model Class selects the adapter default (claude -> sonnet, codex -> gpt-5.4).
# Set MODEL only when you need an explicit override; Pi normally relies on its
# provider config unless MODEL is set.
MODEL_CLASS="low"
# MODEL="sonnet"

# Explicit sandbox name (only needed if AGENT_CMD does not contain `sbx run`).
# SANDBOX_NAME="my-project"

# How the agent runs the test suite during an iteration.
TEST_CMD="bash tests/pick_next_issue_spec.sh"

# How the agent runs the linter. Use ':' for no-op.
LINT_CMD=":"

# Non-interactive iteration artifacts:
#   .ralph-logs/<prd-or-milestone>/iter-<N>-<timestamp>.jsonl
#   .ralph-logs/<prd-or-milestone>/iter-<N>-<timestamp>.final.txt

# CPU-seconds threshold for `ralph status` to flag a stuck child process.
# STUCK_CPU_SECS=180
